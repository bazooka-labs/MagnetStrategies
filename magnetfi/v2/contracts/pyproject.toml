[tool.poetry]
name = "contracts"
version = "0.1.0"
description = "Algorand smart contracts"
authors = ["bazookacreate-8771 <bazooka.create@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
algokit-utils = "^4.0.0"
python-dotenv = "^1.0.0"
algorand-python = "^3"
algorand-python-testing = "^1"

[tool.poetry.group.dev.dependencies]
algokit-client-generator = "^2.1.0"
puyapy = "==5.9.0"   # pinned for reproducible TEAL — the compiler the liq-penalty upgrade was reviewed + built against

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

