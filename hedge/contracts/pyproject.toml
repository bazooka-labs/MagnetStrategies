[tool.poetry]
name = "hedge-contracts"
version = "0.1.0"
description = "Hedge — daily BTC option ladder on Algorand"
authors = ["bazookacreate-8771 <bazooka.create@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
algokit-utils = "^4.0.0"
python-dotenv = "^1.0.0"
algorand-python = "^3"
algorand-python-testing = "^1"

[tool.poetry.group.dev.dependencies]
